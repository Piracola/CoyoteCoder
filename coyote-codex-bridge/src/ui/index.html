<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>CoyoteCoder 控制台</title>
    <link rel="stylesheet" href="/ui/styles.css">
  </head>
  <body>
    <header class="topbar">
      <div>
        <h1>CoyoteCoder</h1>
        <p id="upstreamText">本地控制台</p>
      </div>
      <div class="status-strip" aria-live="polite">
        <span class="pill" id="dryRunPill">Dry-run</span>
        <span class="pill" id="armedPill">未启动</span>
        <span class="pill" id="dglabPill">DG-LAB 未连接</span>
      </div>
    </header>

    <main class="layout">
      <section class="panel provider-panel">
        <div class="panel-head">
          <h2>API 供应商</h2>
          <button class="primary" id="saveProviderBtn" type="button">保存供应商</button>
        </div>
        <form id="providerForm">
          <div class="provider-grid">
            <label>
              预设
              <select id="providerPreset">
                <option value="custom">自定义</option>
                <option value="openai">OpenAI</option>
                <option value="anthropic">Anthropic</option>
                <option value="gemini">Gemini</option>
              </select>
            </label>
            <label>
              名称
              <input id="providerName" type="text" autocomplete="off">
            </label>
            <label>
              协议
              <select id="providerProtocol">
                <option value="openai">OpenAI-compatible</option>
                <option value="anthropic">Anthropic Messages</option>
                <option value="gemini">Gemini GenerateContent</option>
              </select>
            </label>
            <label>
              Base URL
              <input id="providerBaseUrl" type="url" autocomplete="off">
            </label>
            <label>
              API Key 环境变量
              <input id="providerKeyEnv" type="text" autocomplete="off">
            </label>
            <label>
              API Key
              <input id="providerKey" type="password" autocomplete="off" placeholder="留空则不修改">
            </label>
            <label>
              Anthropic Version
              <input id="providerAnthropicVersion" type="text" autocomplete="off">
            </label>
            <label>
              超时 ms
              <input id="providerTimeout" type="number" min="1000" step="1000">
            </label>
          </div>
        </form>
      </section>

      <section class="panel control-panel">
        <div class="panel-head">
          <h2>运行控制</h2>
          <button class="ghost" id="refreshBtn" type="button">刷新</button>
        </div>
        <div class="control-grid">
          <button class="primary" id="startBtn" type="button">启动反馈</button>
          <button class="secondary" id="stopBtn" type="button">停止反馈</button>
          <button class="danger" id="panicBtn" type="button">紧急停止</button>
        </div>
        <div class="switch-row">
          <label class="switch">
            <input id="dryRunToggle" type="checkbox">
            <span></span>
          </label>
          <div>
            <strong>Dry-run</strong>
            <p>开启时只生成计划，不发送真实设备输出。</p>
          </div>
        </div>
      </section>

      <section class="panel qr-panel">
        <div class="panel-head">
          <h2>配对二维码</h2>
          <div class="button-row">
            <button class="ghost" id="connectBtn" type="button">连接</button>
            <button class="ghost" id="disconnectBtn" type="button">断开</button>
          </div>
        </div>
        <div class="qr-box" id="qrBox">
          <span>等待生成</span>
          <img id="qrImage" alt="DG-LAB 配对二维码" hidden>
        </div>
        <button class="primary wide" id="qrBtn" type="button">生成配对码</button>
        <p class="mono" id="qrLinkText">未获取 clientId</p>
      </section>

      <section class="panel settings-panel">
        <div class="panel-head">
          <h2>电击参数</h2>
          <button class="primary" id="saveBtn" type="button">保存参数</button>
        </div>

        <form id="settingsForm">
          <div class="settings-grid">
            <fieldset>
              <legend>安全限制</legend>
              <label>
                A 通道上限
                <input id="limitA" type="number" min="0" max="100" step="1">
              </label>
              <label>
                B 通道上限
                <input id="limitB" type="number" min="0" max="100" step="1">
              </label>
              <label>
                最小间隔 ms
                <input id="minInterval" type="number" min="0" max="10000" step="10">
              </label>
              <label>
                单次最长 ms
                <input id="maxContinuous" type="number" min="1" max="30000" step="100">
              </label>
              <label>
                每分钟上限
                <input id="maxPerMinute" type="number" min="1" max="600" step="1">
              </label>
            </fieldset>

            <fieldset>
              <legend>请求开始</legend>
              <label>
                通道
                <select id="requestChannel">
                  <option value="A">A</option>
                  <option value="B">B</option>
                </select>
              </label>
              <label>
                强度 %
                <input id="requestIntensity" type="number" min="0" max="100" step="1">
              </label>
              <label>
                持续 ms
                <input id="requestDuration" type="number" min="1" max="30000" step="10">
              </label>
            </fieldset>

            <fieldset>
              <legend>响应开始</legend>
              <label>
                通道
                <select id="startedChannel">
                  <option value="A">A</option>
                  <option value="B">B</option>
                </select>
              </label>
              <label>
                强度 %
                <input id="startedIntensity" type="number" min="0" max="100" step="1">
              </label>
              <label>
                持续 ms
                <input id="startedDuration" type="number" min="1" max="30000" step="10">
              </label>
            </fieldset>

            <fieldset>
              <legend>流式输出</legend>
              <label>
                通道
                <select id="chunkChannel">
                  <option value="A">A</option>
                  <option value="B">B</option>
                </select>
              </label>
              <label>
                最小强度 %
                <input id="chunkMin" type="number" min="0" max="100" step="1">
              </label>
              <label>
                最大强度 %
                <input id="chunkMax" type="number" min="0" max="100" step="1">
              </label>
              <label>
                持续 ms
                <input id="chunkDuration" type="number" min="1" max="30000" step="10">
              </label>
              <label>
                速率窗口 ms
                <input id="chunkWindow" type="number" min="1" max="10000" step="50">
              </label>
            </fieldset>

            <fieldset>
              <legend>响应完成</legend>
              <label>
                通道
                <select id="doneChannel">
                  <option value="A">A</option>
                  <option value="B">B</option>
                </select>
              </label>
              <label>
                强度 %
                <input id="doneIntensity" type="number" min="0" max="100" step="1">
              </label>
              <label>
                持续 ms
                <input id="doneDuration" type="number" min="1" max="30000" step="10">
              </label>
            </fieldset>
          </div>
        </form>
      </section>

      <section class="panel events-panel">
        <div class="panel-head">
          <h2>最近事件</h2>
          <span id="eventCount">0</span>
        </div>
        <div class="events" id="events"></div>
      </section>
    </main>

    <div class="toast" id="toast" role="status" aria-live="polite"></div>
    <script src="/ui/app.js" type="module"></script>
  </body>
</html>
