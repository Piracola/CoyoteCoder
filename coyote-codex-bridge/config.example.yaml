server:
  host: "127.0.0.1"
  port: 8787

upstream:
  active_provider: "openai"
  providers:
    - id: "openai"
      name: "OpenAI"
      protocol: "openai" # openai | anthropic | gemini
      base_url: "https://api.openai.com"
      # api_key: "" # stored locally in this config file
      timeout_ms: 120000
    - id: "local-compatible"
      name: "Local Compatible"
      protocol: "openai"
      base_url: "http://127.0.0.1:11434/v1"
      timeout_ms: 120000

privacy:
  store_raw_content: false
  recent_event_limit: 200

safety:
  dry_run: true
  armed: false
  channel_limits:
    A: 15
    B: 10
  max_continuous_output_ms: 3000
  max_events_per_minute: 120
  panic_zero_on_exit: true

policy:
  request_started:
    channel: "A"
    coefficient: 1.0
    duration_ms: 120
  response_started:
    channel: "B"
    coefficient: 1.0
    duration_ms: 120
  response_chunk:
    channel: "B"
    coefficient: 1.0
    micro_intensity: 0.1
    duration_ms: 120
  response_tool_call:
    channel: "A"
    coefficient: 1.0
    duration_ms: 160
  response_error_status:
    channel: "A"
    coefficient: 1.0
    duration_ms: 220
  response_done:
    channel: "A"
    coefficient: 1.0
    duration_ms: 180
    token_target: 1200

dglab:
  enabled: true
  socket_url: "ws://127.0.0.1:9999"
  qr_host: "auto" # auto picks the first non-internal IPv4 address for APP scanning
  qr_port: 9999
  default_channels:
    request: "A"
    response: "B"
